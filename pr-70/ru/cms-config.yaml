backend:
  base_url: https://sveltia-github-auth.marcus-pollio.workers.dev/
  branch: testing
  commit_messages:
    create: '{{collection}}: Create {{slug}}'
    delete: '{{collection}}: Delete {{slug}}'
    deletemedia: 'Media: Delete {{path}}'
    openauthoring: '{{message}}'
    update: '{{collection}}: Update {{slug}}'
    uploadmedia: 'Media: Upload {{path}}'
  name: github
  repo: marcuspollio/FreeCAD-website
collections:
- create: true
  description: This is the News blog collection with FreeCAD articles
  fields:
  - hint: Use similar title as existing articles for coherence
    i18n: true
    label: Title
    name: title
    required:
    - en
    widget: string
  - i18n: true
    label: Description
    name: description
    required: false
    widget: string
  - i18n: duplicate
    label: Date
    name: date
    widget: datetime
  - default: FreeCAD
    hint: Use similar author name as existing ones for coherence
    i18n: duplicate
    label: Authors
    name: authors
    pattern:
    - .{3,}
    - At least 3 characters
    widget: string
  - default: true
    i18n: duplicate
    label: Draft
    name: draft
    required: false
    widget: boolean
  - i18n: duplicate
    label: Category
    name: categories
    options:
    - announcement
    - event
    - feature
    - showcase
    - tutorial
    - update
    widget: select
  - fields:
    - i18n: duplicate
      label: Image source
      name: image
      widget: image
    - i18n: true
      label: Image caption
      name: caption
      widget: string
    i18n: true
    label: Cover image
    name: cover
    required: false
    widget: object
  - i18n: true
    label: Content
    linked_images: false
    name: body
    pattern:
    - .{3,}
    - At least 3 characters
    required:
    - en
    widget: markdown
  folder: content/news
  format: frontmatter
  i18n: true
  icon: brand_awareness
  index_file:
    editor:
      preview: true
    fields:
    - i18n: true
      label: Title
      name: title
      pattern:
      - .{3,}
      - At least 3 characters
      widget: string
    - i18n: true
      label: Description
      name: description
      widget: string
    - fields:
      - i18n: duplicate
        label: Image source
        name: image
        widget: image
      - i18n: true
        label: Image caption
        name: caption
        widget: string
      i18n: true
      label: Cover image
      name: cover
      required: false
      widget: object
    icon: brand_awareness
    label: News Section index
    name: _index
  label: News
  media_folder: ""
  name: news
  path: '{{year}}/{{month}}/{{slug}}/index'
  preview_path: FreeCAD-website/news/{{slug}}
  public_folder: ""
  slug: '{{slug}}'
  sortable_fields:
    default:
      direction: descending
      field: date
    fields:
    - title
    - date
    - authors
  summary: '**{{title}}** · {{date | date(''DD MMM YYYY'')}} {{draft | ternary(''(draft)'',
    '''')}} · {{authors | default(''no authors'')}} · {{locales | upper}}'
  thumbnail: cover.image
  view_filters:
    filters:
    - field: draft
      label: Drafts
      name: drafts
      pattern: true
    - field: date
      label: Posted in 2023
      name: posts_2023
      pattern: ^2023
    - field: date
      label: Posted in 2024
      name: posts_2024
      pattern: ^2024
    - field: date
      label: Posted in 2025
      name: posts_2025
      pattern: ^2025
    - field: date
      label: Posted in 2026
      name: posts_2026
      pattern: ^2026
    - field: categories
      label: Announcement
      name: announcement
      pattern: announcement
    - field: categories
      label: Event
      name: event
      pattern: event
    - field: categories
      label: Feature
      name: feature
      pattern: feature
    - field: categories
      label: Showcase
      name: showcase
      pattern: showcase
    - field: categories
      label: Tutorial
      name: tutorial
      pattern: tutorial
    - field: categories
      label: Update
      name: update
      pattern: update
  view_groups:
    default: year
    groups:
    - field: date
      label: Year
      name: year
      pattern: \d{4}
    - field: categories
      label: Categories
      name: category
- divider: true
- description: This is site Homepage
