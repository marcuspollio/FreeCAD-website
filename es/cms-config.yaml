i18n:
  default_locale: en
  initial_locales: default
  locales:
  - en
  - fr
  - tr
  structure: multiple_files
locale: es-ES
logo_url: https://marcuspollio.github.io/FreeCAD-website/FreeCAD-symbol.svg
media_folder: static
media_libraries:
  default:
    config:
      max_file_size: 2048000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          height: 2000
          quality: 90
          width: 2000
        svg:
          optimize: true
public_folder: /
singletons:
- fields:
  - fields:
    - label: Title
      name: title
      widget: string
    - label: URL
      name: url
      widget: string
    - label: Parent
      name: parent
      options:
      - features
      - download
      - releases
      - news
      - community
      - documentation
      - contribute
      - donate
      required: false
      widget: select
    label: Footer links
    name: footer
    root: true
    widget: list
  file: themes/Trigo/data/footer.yaml
  icon: bottom_navigation
  label: Footer
  name: footer
- fields:
  - allow_add: false
    fields:
    - i18n: duplicate
      label: String ID
      name: id
      widget: string
    - i18n: true
      label: Translation
      name: translation
      required: false
      widget: string
    i18n: true
    label: Theme i18n strings
    name: i18n
    root: true
    summary: '{{fields.id}}'
    widget: list
  file: themes/Trigo/i18n/{{locale}}.yaml
  i18n: true
  icon: translate
  label: Theme strings translations
  name: theme
site_url: https://marcuspollio.github.io/FreeCAD-website/
slug:
  clean_accents: true
  encoding: ascii
  sanitize_replacement: '-'
