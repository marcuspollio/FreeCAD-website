backend:
  base_url: https://sveltia-github-auth.marcus-pollio.workers.dev/
  branch: testing
  commit_messages:
    create: '{{collection}}: create {{slug}}'
    delete: '{{collection}}: delete {{slug}}'
    deleteMedia: 'Media: delete {{path}}'
    openAuthoring: '{{message}}'
    update: '{{collection}}: update {{slug}}'
    uploadMedia: 'Media: upload {{path}}'
  name: github
  repo: marcuspollio/FreeCAD-website
collections:
- create: true
  description: This is the News blog collection with FreeCAD articles
  fields:
  - hint: Use a similar title structure as existing articles for coherence
    i18n: true
    label: Article Title
    name: title
    required:
    - en
    widget: string
  - i18n: true
    label: Article Description
    name: description
    widget: string
  - i18n: duplicate
    label: Publication Date
    name: date
    widget: datetime
  - default: FreeCAD
    hint: Use a similar author name as existing ones for coherence
    i18n: duplicate
    label: Article Authors
    name: authors
    pattern:
    - .{3,}
    - Must have at least 3 characters
    widget: string
  - default: true
    i18n: duplicate
    label: Draft
    name: draft
    required: false
    widget: boolean
  - i18n: duplicate
    label: Article Category
    name: categories
    options:
    - announcement
    - event
    - feature
    - showcase
    - tutorial
    - update
    widget: select
  - default: false
    i18n: duplicate
    label: Show Table of Contents
    name: params.ToC
    required: false
    widget: boolean
  - i18n: duplicate
    label: Cover image
    name: cover.image
    widget: image
  - i18n: true
    label: Cover caption
    name: cover.caption
    widget: string
  - i18n: true
    label: Cover alternative text
    name: cover.alt
    widget: string
  - default: false
    hint: Article featured on top of the Homepage
    i18n: duplicate
    label: Hero
    name: params.hero
    required: false
    widget: boolean
  - i18n: true
    label: Content
    linked_images: false
    name: body
    pattern:
    - .{3,}
    - Must have at least 3 characters
    required:
    - en
    widget: markdown
  folder: content/news
  format: frontmatter
  i18n: true
  icon: brand_awareness
  index_file:
    editor:
      preview: true
    fields:
    - i18n: true
      label: Title
      name: title
      pattern:
      - .{3,}
      - Must have at least 3 characters
      required:
      - en
      widget: string
    - i18n: true
      label: Description
      name: description
      widget: string
    - default: 12
      hint: Integer between 1 and 30
      i18n: duplicate
      label: Pagination
      max: 30
      min: 1
      name: paginate
      value_type: int
      widget: number
    - i18n: duplicate
      label: Cover image
      name: cover.image
      widget: image
    - i18n: true
      label: Cover caption
      name: cover.caption
      widget: string
    - i18n: true
      label: Cover alternative text
      name: cover.alt
      widget: string
    icon: brand_awareness
    label: News Index
    name: _index
  label: News
  media_folder: ""
  name: news
  path: '{{year}}/{{month}}/{{slug}}/index'
  public_folder: ""
  slug: '{{slug}}'
  thumbnail: cover.image
- divider: true
- files:
  - fields:
    - i18n: true
      label: Title
      name: title
      pattern:
      - .{3,}
      - Must have at least 3 characters
      widget: string
    - i18n: true
      label: Description
      name: description
      widget: string
    - default: false
      i18n: duplicate
      label: Show Table of Contents
      name: params.ToC
      required: false
      widget: boolean
    - fields:
      - fields:
        - i18n: true
          label: Label
          name: label
          widget: string
        - i18n: duplicate
          label: URL
          name: url
          widget: string
        i18n: true
        label: Buttons
        name: buttons
        summary: '{{fields.label}}'
        widget: list
      i18n: true
      label: Params
      name: params
      summary: '{{fields.buttons}}'
      widget: object
    - i18n: true
      label: Content
      linked_images: false
      name: body
      pattern:
      - .{3,}
      - Must have at least 3 characters
      widget: markdown
    file: content/homepage/index.{{locale}}.md
    i18n: true
    icon: home
    label: Homepage
    media_folder: ""
    name: homepage
    public_folder: ""
